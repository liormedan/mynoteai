name: plan-check

on:
  push:
    branches: [main, "sprint-*"]
    tags: ["v0.*"]
  pull_request:

jobs:
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compare git history with docs/plan.html
        run: node scripts/plan-check.mjs
